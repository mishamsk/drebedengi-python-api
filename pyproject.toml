[project]
name = "drebedengi-python-api"
version = "0.2.0"
description = "Python wrapper for Drebedengi SOAP API."
authors = [{ name = "Mike Perlov", email = "mishamsk@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs>=22.1.0",
    "click>=8.1.3",
    "zeep>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/mishamsk/drebedengi-python-api"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "bump2version>=1.0.1",
    "pre-commit>=4.5.1",
    "twine>=6.2.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-exclude>=1.0.2",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.7.4",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings[python]>=1.0.3",
]
lint = ["ruff>=0.15.22"]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
typecheck = [
    "mypy>=1.19.1",
    "types-requests>=2.32.4.20260107",
]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--basetemp=testtemp"

[tool.coverage.run]
omit = ["*/test/*", "**/conftest.py"]

[tool.coverage.report]
omit = ["*/test/*"]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "@abc.abstractmethod",
    "def __repr__",
    "if .*DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "first-party",
    "third-party",
    "local-folder",
    "typing",
]

[tool.ruff.lint.isort.sections]
typing = ["typing"]

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "drebedengi"
